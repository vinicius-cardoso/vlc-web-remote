; vlc-remote: retro (SNES dark) VLC knob for ESP32-C3 Super Mini + 2.4" ST7789 + EC11.
; Talks to the vlc-web-remote server (/api/status, /api/control), never to VLC directly.
; Wiring: ../docs/wiring/esp32c3-tft-ec11.json. Settings: src/config.h (copy config.example.h).
[env:c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_mode = dio
monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
lib_deps =
  adafruit/Adafruit GFX Library
  adafruit/Adafruit ST7735 and ST7789 Library
  bblanchon/ArduinoJson@^7
build_flags =
  -std=gnu++17
  -Wall
  ; Serial over the Super Mini's native USB port
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
build_unflags = -std=gnu++11
